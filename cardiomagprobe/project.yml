name: CardioMagProbe
options:
  bundleIdPrefix: org.cardiomag
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  CardioMagProbe:
    type: application
    platform: iOS
    sources:
      - path: CardioMagProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cardiomag.CardioMagProbe
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: CardioMagProbe/Info.plist
  CardioMagProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CardioMagProbeTests
    dependencies:
      - target: CardioMagProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cardiomag.CardioMagProbeTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CardioMagProbe:
    build:
      targets:
        CardioMagProbe: all
        CardioMagProbeTests: [test]
    test:
      targets:
        - CardioMagProbeTests

