stage = "PROBE"                  # the gates produce numbers that are quoted in the corpus
visibility = "public"            # decided 2026-09-25; the repo flips once its history is cleaned (CLAUDE.md)
visibility_decided = "2026-09-25"
profile = "polarizetech"

[corpus]
project = "bioem-propagation"
