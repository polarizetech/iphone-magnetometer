name: BiomimeticRadar
options:
  bundleIdPrefix: com.biomimeticradar
  deploymentTarget:
    iOS: "17.0"
# The signing team comes from config/Local.xcconfig (git-ignored), through config/Signing.xcconfig.
# It used to be written here, and before that only in the pbxproj, where `xcodegen generate` dropped it
# (2026-09-23). An xcconfig survives generation and keeps anyone's team out of the repo.
configFiles:
  Debug: config/Signing.xcconfig
  Release: config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  BiomimeticRadar:
    type: application
    platform: iOS
    sources:
      # The app is a RECORDER. The analysis engines stay in the repo and in the SwiftPM core
      # (`swift test` builds them, and they are the reference for the Python ports), but they are
      # NOT compiled into the phone — the Mac does the interpreting now. Excluding rather than
      # deleting is deliberate: the algorithms are worked-out and tested, and losing them to make a
      # folder listing shorter would be the expensive kind of tidy.
      - path: BiomimeticRadar
        excludes:
          - "Models/ExperimentModels.swift"
          - "Processing/SignalProcessor.swift"
          - "Processing/SignalCensus.swift"
          - "Processing/CrossBandCoupling.swift"
          - "Processing/BandRegistry.swift"
          - "Processing/FFT.swift"
          - "Processing/LightningCoupling.swift"
          - "Processing/ReferenceSignals.swift"
          - "Processing/SyntheticDataSimulator.swift"
          - "Processing/QualityGatesSession.swift"
    # The Info.plist is generated by xcodegen from this block (`xcodegen generate` writes it to
    # `path`). It replaced the INFOPLIST_KEY_* build settings on 2026-08-23 because the always-on
    # stream needs keys those settings cannot express: UIBackgroundModes and NSAppTransportSecurity.
    info:
      path: BiomimeticRadar/Resources/Info.plist
      properties:
        CFBundleDisplayName: FieldLab
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: >-
          Location is optionally recorded with experiment metadata, and a coarse location session
          is what keeps the magnetometer delivering while the always-on stream runs in the background.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          The always-on stream keeps a coarse location session open so the magnetometer keeps
          delivering in the background. Position is recorded only if you turn that on.
        # The barometer (CMAltimeter) needs this; it is recorded once per chunk as a weather
        # covariate, never as a measurement of anything magnetic.
        NSMotionUsageDescription: >-
          Barometric pressure and relative altitude are recorded once per chunk as covariates
          beside the magnetometer — a falling barometer is the cheapest local storm indicator
          this phone has.
        # The spool IS the export: unsent chunks are visible in Files ▸ On My iPhone ▸ FieldLab,
        # so a stretch of recording can be copied off by hand when the Mac is unreachable.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # `location` is what lets Core Motion keep delivering in the background (see
        # Services/StreamController.swift). `BackgroundKeepAlive` traps without it.
        UIBackgroundModes:
          - location
        # A personal research rig that also talks to dev servers on http://100.x.y.z:port over the
        # tailnet. The canonical server is HTTPS through the gateway; this exists for the inner loop.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biomimeticradar.app
        TARGETED_DEVICE_FAMILY: "1"
        # The icon is one 1024x1024 opaque PNG in Resources/Assets.xcassets; iOS 17 draws every
        # other size from it and applies its own rounding, so the art is square and flattened
        # onto black (the source had transparent corners, which ship as a black square here).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - BiomimeticRadarTests
  BiomimeticRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BiomimeticRadarTests
    dependencies:
      - target: BiomimeticRadar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biomimeticradar.tests
